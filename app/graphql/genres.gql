# Genre list for the catalogue filter.
#
# The schema has no dedicated `genres` query, so the list is derived: fetch the
# shows' genre arrays and dedupe client-side (see ~/composables/useGenresQuery).
# Genres are not localised in the data (always English), but we still query by
# variant so the request honours the active locale / fallback. The catalogue is
# small (~20 shows), so a single first:100 page covers the whole genre set.
query Genres($where: NodeFilterInput!) {
  tvshow_collection(first: 100, where: $where) {
    items {
      ... on Show {
        properties {
          genres
        }
      }
    }
  }
}
