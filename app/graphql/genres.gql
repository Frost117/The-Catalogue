# Genre list for the catalogue filter.
#
# The schema has no dedicated `genres` query, so the list is derived: fetch the
# shows' genre arrays and dedupe client-side (see ~/composables/useGenresQuery).
# Genres are not localised in the data (always English). A single first:100 page
# covers the whole genre set for this catalogue.
query Genres($where: NodeFilterInput!, $first: Int!) {
  tvshow_collection(first: $first, where: $where) {
    items {
      ... on Show {
        genres
      }
    }
  }
}
