# Episodes for a show. Episodes are sibling content nodes linked to their show by
# the numeric `tvShowId` (the TV Maze show id, i.e. the number in `show-<n>`), so
# they are matched by `{ episode: { tvShowId: <n> } }`. `name` and `summary` are
# localized inline ({ en, da, vi }), same as Show.
#
# `first` is capped at 100; the composable pages through with `after` until
# pageInfo.hasNextPage is false to gather every episode.
query Episodes($where: NodeFilterInput!, $after: String) {
  tvshow_collection(first: 100, after: $after, where: $where) {
    items {
      ... on Episode {
        id
        name {
          en
          da
          vi
        }
        season
        number
        summary {
          en
          da
          vi
        }
      }
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}
