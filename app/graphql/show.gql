# Single show detail, matched by namespaced id ({ show: { id: "show-<n>" } }),
# built in ~/composables/useShowQuery from the numeric id parsed out of the URL
# slug.
#
# Episodes and cast are NOT nested under a show in this schema — they are sibling
# content nodes linked by the numeric `tvShowId`, so they are fetched separately
# (see episodes.gql / cast.gql). `name` and `summary` are localized inline
# ({ en, da, vi }).
query Show($where: NodeFilterInput!) {
  tvshow_collection(first: 1, where: $where) {
    items {
      ... on Show {
        id
        name {
          en
          da
          vi
        }
        genres
        status
        premiered
        network {
          name
        }
        image {
          medium
          original
        }
        rating {
          average
        }
        summary {
          en
          da
          vi
        }
      }
    }
  }
}
