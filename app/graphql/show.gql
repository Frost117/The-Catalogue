# Single show detail, matched by locale variant + route path.
#
# The `where` filter ({ show: { variant, route: { path } } }) is built in
# ~/composables/useShowQuery. Episodes are NOT nested under a show in this
# schema — they are sibling content nodes addressed by route-path prefix, so
# they are fetched separately (see episodes.gql). Summary is RichText (use
# .markup); cast is a block list of CastMember elements.
query Show($where: NodeFilterInput!) {
  tvshow_collection(first: 1, where: $where) {
    items {
      ... on Show {
        id
        variant
        name
        route {
          path
        }
        properties {
          image
          rating
          genres
          status
          network
          premiered
          summary {
            markup
          }
          cast {
            items {
              content {
                ... on CastMember {
                  id
                  properties {
                    personName
                    characterName
                    personImage
                    characterImage
                  }
                }
              }
            }
          }
        }
      }
    }
  }
}
