name = "the-catalogue"
compatibility_date = "2025-01-15"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "dist"

# Runtime environment. On Cloudflare these are the app's config source: Nuxt
# overrides runtimeConfig at request time from env vars named NUXT_<KEY> (the
# runtimeConfig key, not the old process.env name — e.g. composeGraphqlUrl <-
# NUXT_COMPOSE_GRAPHQL_URL). The build-time process.env reads in nuxt.config.ts
# still power local dev via .env; they just resolve to empty on CF, where these
# take over. Secrets (NUXT_COMPOSE_CLIENT_ID / NUXT_COMPOSE_CLIENT_SECRET) are
# NOT here — set them as encrypted secrets in the Pages dashboard. See
# docs/deployment.md.
[vars]
NUXT_COMPOSE_GRAPHQL_URL = "https://graphql.germanywestcentral.umbracocompose.com/lan/third-env"
NUXT_COMPOSE_COLLECTION_ALIAS = "tvshow-collection"
NUXT_MEMBER_LOGIN_HOST = "https://compose-test.swatblackops.xyz"
NUXT_PUBLIC_RECAPTCHA_SITE_KEY = "6LcjMUkrAAAAAC8mwzUYsSBqQED4QFY190NyX2Yv"
